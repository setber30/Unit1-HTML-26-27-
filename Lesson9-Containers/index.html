<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Containers and identity</title>
    <style>
        .highlight {
            background-color: yellowgreen;
        }
        #site-footer {
            color:blueviolet;
        }
        .card {
            border: 2px solid #94a3b8;
            border-radius: 8px;
        }
        #main-nav {
            background: navy;
            color: white;
        }
        .price {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav id="main-nav">...nav links...</nav>
    <p class="highlight">First note</p>
    <p class="highlight">Second note</p>
    <p class="highlight">Third note</p>
    <p>A plain note - no class, no color</p>
    
    <!-- (.card>h2+p)*2 -->
    <div class="card">
        <h2>Product A</h2>
        <p>First Product</p>
    </div>
    <div class="card">
        <h2>Product B</h2>
        <p>Second Product</p>
    </div>
    <p>The price is <span class="price">$29</span> today only!</p>
    <footer id="site-footer">
        @ 2026 CLUB SIGN-UP
    </footer>
</body>
</html>
